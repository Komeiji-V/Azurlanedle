server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/x-component
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 自带的 404.html 要显式接管，否则访客看到的是 nginx 默认错误页
    error_page 404 /404.html;

    # nginx 的 add_header 不会继承进「自己也有 add_header」的 location，
    # 所以每个 location 都要各自带上这两个安全头（抽成片段避免漏写）
    include /etc/nginx/security-headers.conf;

    # 带内容哈希的构建产物可以长期缓存
    location /assets/ {
        # 不要用 expires：它会额外下发一个 Cache-Control，和下面这行重复
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # RSC 载荷：MIME 必须是 text/x-component，客户端会检查这个类型
    location ~ \.rsc$ {
        types { text/x-component rsc; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # HTML 不缓存，保证重新部署后立刻生效
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
