services:
  hangyiba:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可以在项目根目录建 .env 写 NPM_REGISTRY=https://registry.npmmirror.com
        # （.env 不入库，默认留空即走官方源）
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    image: hangyiba:latest
    container_name: hangyiba
    ports:
      # 宿主机端口可用 HANGYIBA_PORT 覆盖，例如 HANGYIBA_PORT=9000 docker compose up -d
      - "${HANGYIBA_PORT:-8080}:80"
    restart: unless-stopped
