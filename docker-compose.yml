# 项目名固定成 azurlanedle，避免容器/网络名跟着目录名乱跑
name: azurlanedle

services:
  azurlanedle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可以在项目根目录建 .env 写 NPM_REGISTRY=https://registry.npmmirror.com
        # （.env 不入库，默认留空即走官方源）
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    image: azurlanedle:latest
    container_name: azurlanedle
    ports:
      # 宿主机端口可用 AZURLANEDLE_PORT 覆盖，例如 AZURLANEDLE_PORT=9000 docker compose up -d
      - "${AZURLANEDLE_PORT:-8080}:80"
    restart: unless-stopped
